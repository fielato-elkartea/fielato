<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIELATO - Temporada 2026-2027</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a1208; color: #d4e8c2; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
button { cursor: pointer; font-family: inherit; }
input, select, textarea { font-family: inherit; }
.nav { background: #0a1a0c; border-bottom: 1px solid #1a3020; display: flex; overflow-x: auto; padding: 0 16px; }
.nav button { background: transparent; border: none; border-bottom: 2px solid transparent; color: #3a6a3a; padding: 11px 16px; font-size: 13px; white-space: nowrap; }
.nav button.active { border-bottom-color: #4caf70; color: #7ee8a2; font-weight: 700; }
.main { padding: 18px 16px; max-width: 1300px; margin: 0 auto; }
.card { background: #0d1a10; border: 1px solid #1a3020; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.btn { background: #1e4d33; border: 1px solid #3d8a5f; color: #e8f5e2; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600; }
.input { background: #0a1208; border: 1px solid #1e3828; color: #d4e8c2; border-radius: 8px; padding: 9px 14px; font-size: 13px; outline: none; width: 100%; }
.badge { border-radius: 4px; padding: 1px 6px; font-size: 10px; font-weight: 700; }
.badge-SOCIO { background: #1e4d33; color: #7ee8a2; border: 1px solid #2d6a4f; }
.badge-INVITADO { background: #1e3a4d; color: #7eb8e8; border: 1px solid #2d5a6a; }
.badge-MENOR { background: #4d3a1e; color: #e8c27e; border: 1px solid #6a522d; }
.badge-ZP { background: #3a1e4d; color: #c27ee8; border: 1px solid #5a2d6a; }
.mes-btn { border-radius: 20px; padding: 6px 14px; font-size: 12px; border: 1px solid #1a3020; background: #0d1a10; color: #4a7a5a; margin: 0 4px 4px 0; }
.mes-btn.active { background: #1e4d33; border-color: #3d8a5f; color: #e8f5e2; }
.check-btn { width: 32px; height: 32px; border-radius: 8px; border: 2px solid #1a3020; background: #0d1a10; color: #1e3828; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }
.check-btn.on { border-color: #3d8a5f; background: #1e4d33; color: #4caf70; }
table { border-collapse: collapse; width: 100%; font-size: 11px; }
th { padding: 6px 5px; background: #060e08; color: #3a6a3a; font-weight: 600; font-size: 10px; border: 1px solid #111a11; white-space: nowrap; text-align: center; }
td { padding: 5px; border: 1px solid #111a11; text-align: center; }
.overflow-x { overflow-x: auto; border-radius: 10px; border: 1px solid #1a3020; margin-bottom: 20px; }
.grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; margin-top: 20px; }
.stat-card { background: #0d1a10; border: 1px solid #1a3020; border-radius: 10px; padding: 14px 16px; }
.pieza-btn { width: 28px; height: 28px; border-radius: 6px; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.turno-jab { background: #1a1208; border: 2px solid #e8a84a; border-radius: 10px; padding: 12px 16px; }
.turno-cor { background: #0a1220; border: 2px solid #a8d8e8; border-radius: 10px; padding: 12px 16px; }
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzywWV9J_DosII8kfZPLfRPpku8eQL7dAQVjKH_XYBFXi8s1T6usIVt1y-ub_50zq0s/exec";
const PIN = "1234";

const MESES = [

  {id:"oct",label:"Octubre",eu:"Urria",abbr:"OCT"},

const GRUPOS = ["1","2","3","4","5/6","7"];
const CUOTA = {"1":[2,2],"2":[2,2],"3":[2,2],"4":[1,1],"5/6":[3,3],"7":[2,2]};
const ORDEN_JAB = ["1","2","3","4","5/6","7"];
const ORDEN_COR = ["7","5/6","4","3","2","1"];

const WEEKENDS = {
  sep:{"2026-09-05":true,"2026-09-06":true,"2026-09-12":true,"2026-09-13":true,"2026-09-19":true,"2026-09-20":true,"2026-09-26":true,"2026-09-27":true},
  oct:{"2026-10-03":true,"2026-10-04":true,"2026-10-10":true,"2026-10-11":true,"2026-10-17":true,"2026-10-18":true,"2026-10-24":true,"2026-10-25":true,"2026-10-31":true},
  nov:{"2026-11-01":true,"2026-11-07":true,"2026-11-08":true,"2026-11-14":true,"2026-11-15":true,"2026-11-21":true,"2026-11-22":true,"2026-11-28":true,"2026-11-29":true},
  dic:{"2026-12-05":true,"2026-12-06":true,"2026-12-12":true,"2026-12-13":true,"2026-12-19":true,"2026-12-20":true,"2026-12-26":true,"2026-12-27":true},
  ene:{"2027-01-02":true,"2027-01-03":true,"2027-01-09":true,"2027-01-10":true,"2027-01-16":true,"2027-01-17":true,"2027-01-23":true,"2027-01-24":true,"2027-01-30":true,"2027-01-31":true},
  feb:{"2027-02-06":true,"2027-02-07":true,"2027-02-13":true,"2027-02-14":true,"2027-02-20":true,"2027-02-21":true,"2027-02-27":true,"2027-02-28":true},
  mar:{"2027-03-06":true,"2027-03-07":true,"2027-03-13":true,"2027-03-14":true,"2027-03-20":true,"2027-03-21":true,"2027-03-27":true,"2027-03-28":true},
  jul:{}
};

let miembros = [], calendario = JSON.parse(JSON.stringify(WEEKENDS));
let cuotaBase = 750, cuotaFija = 75;
let mesActivo = "sep", mesActivo2 = "sep", mesCal = "sep";
let fechaActiva = null, filtroTipo = "TODOS", filtroMiembro = "TODOS";
let repartos = [], tarjetas = {}, socioTabActual = "grupos";
let socioSeleccionado = null, grupoExpandido = null;
let tarjetaBuscadorAbierto = null;
let propuestaPendiente = [];

// ── SHEETS API ──
function cleanDate(f) { if(!f)return f; return String(f).length>10?String(f).substring(0,10):String(f); }

async function sheetRead(range) {
  const sheet = range.split("!")[0];
  const res = await fetch(SCRIPT_URL + "?action=read&sheet=" + encodeURIComponent(sheet));
  if (!res.ok) throw new Error("Error " + res.status);
  const d = await res.json();
  if (d && d.error) throw new Error(d.error);
  return d || [];
}

async function sheetWrite(range, values) {
  const sheet = range.split("!")[0];
  const fd = new FormData();
  fd.append("action", "write");
  fd.append("sheet", sheet);
  fd.append("values", JSON.stringify(values));
  const res = await fetch(SCRIPT_URL, {method:"POST", body:fd});
  if (!res.ok) throw new Error("HTTP " + res.status);
  const t = await res.text();
  try { const d = JSON.parse(t); if (d && d.error) throw new Error(d.error); } catch(e) {}
}

// ── HELPERS ──
function totalBatidas() {
  return Object.entries(calendario).reduce((s,[mes,m])=>mes==="jul"?s:s+Object.keys(m).length,0);
}

function calcStats(m) {
  const total = totalBatidas();
  let dias = 0;
  Object.entries(m.batidas||{}).forEach(([mes,fechas])=>{
    if(mes==="jul") return;
    Object.entries(fechas||{}).forEach(([fecha,val])=>{
      if(val && calendario[mes] && calendario[mes][fecha]) dias++;
    });
  });
  const pct = total>0?(dias/total)*100:0;
  const limp = (pct/100)*5;
  const jul = Object.entries((m.batidas&&m.batidas.jul)||{}).filter(([f,v])=>v&&calendario.jul&&calendario.jul[f]).length;
  let jab=0, cor=0;
  Object.values(m.piezas||{}).forEach(mes=>Object.values(mes).forEach(p=>{jab+=(p&&p.jabali)||0;cor+=(p&&p.corzo)||0;}));
  return {dias,pct,limp,jul,jab,cor};
}

function diaAbr(f) {
  try{const c=cleanDate(f);return["Do","Lu","Ma","Mi","Ju","Vi","Sa"][new Date(c+"T12:00:00").getDay()];}catch(e){return"";}
}

function badge(tipo) {
  const cls=tipo==="Z/P"?"ZP":tipo;
  return '<span class="badge badge-'+cls+'">'+tipo+'</span>';
}

function saving(on) { 
  document.getElementById("saving-indicator").style.display=on?"inline":"none"; 
}
async function withSave(fn) {
  saving(true);
  try { 
    await fn();
    const ind = document.getElementById("saving-indicator");
    if(ind){ ind.textContent="✓ Guardado"; setTimeout(()=>{ ind.textContent="Guardando..."; ind.style.display="none"; },2000); }
  } catch(e) { 
    saving(false);
    alert("Error al guardar: " + e.message);
  }
}

function mesesBtns(active, fn) {
  return MESES.map(m=>{
    const cnt=Object.keys(calendario[m.id]||{}).length;
    return '<button class="mes-btn'+(m.id===active?" active":"")+'" onclick="'+fn+'(\''+m.id+'\')">'+m.label+(cnt>0?'<span style="background:#2d6a4f;color:#a8f0b8;border-radius:10px;padding:0 5px;font-size:10px;margin-left:4px">'+cnt+'</span>':"")+' </button>';
  }).join("");
}

function calcularTurno(repartosList) {
  const jab={}, cor={};
  GRUPOS.forEach(g=>{jab[g]=0;cor[g]=0;});
  repartosList.forEach(r=>{
    const esp=String(r.especie||"").toLowerCase(), grp=String(r.grupo||"");
    if(esp==="jabali"&&jab[grp]!==undefined) jab[grp]++;
    if(esp==="corzo"&&cor[grp]!==undefined) cor[grp]++;
  });
  const totalJab=repartosList.filter(r=>r.especie==="jabali").length;
  const totalCor=repartosList.filter(r=>r.especie==="corzo").length;
  function sig(orden,cuotaIdx,actual){
    let idx=0;
    for(let i=0;i<orden.length*5;i++){
      const g=orden[idx%orden.length], cuota=CUOTA[g][cuotaIdx];
      if(actual[g]<cuota) return {grupo:g,falta:cuota-actual[g]};
      idx++;
    }
    return {grupo:orden[0],falta:CUOTA[orden[0]][cuotaIdx]};
  }
  const jr=sig(ORDEN_JAB,0,jab), cr=sig(ORDEN_COR,1,cor);
  return {jabNext:jr.grupo,jabFalta:jr.falta,corNext:cr.grupo,corFalta:cr.falta,jab,cor,totalJab,totalCor};
}

// ── INIT ──
async function init() {
  showScreen("screen-loading");
  try {
    const [rM,rC,rA,rP,rCfg,rRep,rTar] = await Promise.all([
      sheetRead("Miembros!A:D"), sheetRead("Calendario!A:B"),
      sheetRead("Asistencia!A:D"), sheetRead("Piezas!A:E"),
      sheetRead("Config!A:B"), sheetRead("Repartos!A:C"), sheetRead("Tarjetas!A:B")
    ]);
    miembros = (!rM||rM.length<=1) ? [] : rM.slice(1).filter(r=>r[0]).map(r=>({
      id:+r[0], nombre:String(r[1]||""), tipo:String(r[2]||"SOCIO"),
      grupo:(function(v){const s=String(v||"").trim();return s.includes("T")||s.includes("-202")?"":(s==="5/6"?"5/6":s);})(r[3]),
      batidas:{}, piezas:{}
    }));
    if(miembros.length===0) {
      await sheetWrite("Miembros!A1",[["ID","NOMBRE","TIPO","GRUPO"]]);
      await sheetWrite("Asistencia!A1",[["MIEMBRO_ID","MES","FECHA","ASISTE"]]);
      await sheetWrite("Piezas!A1",[["MIEMBRO_ID","MES","FECHA","JABALI","CORZO"]]);
      await sheetWrite("Config!A1",[["CLAVE","VALOR"],["cuotaBase",750],["cuotaFija",75]]);
      await sheetWrite("Repartos!A1",[["FECHA","ESPECIE","GRUPO"]]);
      await sheetWrite("Tarjetas!A1",[["NUMERO","ASIGNADO_A"]]);
      const fCal=[["MES","FECHA"]];
      Object.entries(WEEKENDS).forEach(([mes,fechas])=>Object.keys(fechas).forEach(f=>fCal.push([mes,f])));
      await sheetWrite("Calendario!A1",fCal);
    }
    calendario = JSON.parse(JSON.stringify(WEEKENDS));
    // Only add extra dates from Sheet that are NOT already in WEEKENDS
    // and only if they are valid dates within the season months
    const validMeses = ["sep","oct","nov","dic","ene","feb","mar","jul"];
    if(rC&&rC.length>1) rC.slice(1).forEach(r=>{
      if(r[0]&&r[1]&&validMeses.includes(r[0])){
        const fd=cleanDate(r[1]);
        // Only add if this date is NOT already in WEEKENDS (avoid duplicates)
        // and only add if it looks like a valid season date
        if(fd && !WEEKENDS[r[0]][fd] && calendario[r[0]]!==undefined){
          calendario[r[0]][fd]=true;
        }
      }
    });
    if(rA&&rA.length>1) rA.slice(1).forEach(r=>{
      const m=miembros.find(x=>x.id===+r[0]);
      if(m&&r[1]&&r[2]){
        const mes=String(r[1]).trim();
        const fd=cleanDate(String(r[2]).trim());
        if(!fd) return;
        if(!m.batidas[mes])m.batidas[mes]={};
        m.batidas[mes][fd]=(String(r[3])==="1"||r[3]===1||r[3]===true);
      }
    });
    if(rP&&rP.length>1) rP.slice(1).forEach(r=>{const m=miembros.find(x=>x.id===+r[0]);if(m&&r[1]&&r[2]){const fd=cleanDate(r[2]);if(!m.piezas[r[1]])m.piezas[r[1]]={};m.piezas[r[1]][fd]={jabali:+r[3]||0,corzo:+r[4]||0};}});
    if(rCfg&&rCfg.length>1) rCfg.slice(1).forEach(r=>{if(r[0]==="cuotaBase")cuotaBase=+r[1]||750;if(r[0]==="cuotaFija")cuotaFija=+r[1]||75;});
    repartos=[];
    if(rRep&&rRep.length>1) rRep.slice(1).forEach(r=>{const esp=String(r[1]||"").toLowerCase().trim(),grp=String(r[2]||"").trim(),fec=cleanDate(r[0]);if(fec&&(esp==="jabali"||esp==="corzo")&&GRUPOS.includes(grp))repartos.push({fecha:fec,especie:esp,grupo:grp});});
    tarjetas={};
    for(let i=1;i<=15;i++) tarjetas[i]="";
    if(rTar&&rTar.length>1) rTar.slice(1).forEach(r=>{const num=parseInt(r[0]);if(num>=1&&num<=15)tarjetas[num]=String(r[1]||"").trim();});
    showScreen("screen-inicio");
  } catch(e) {
    document.getElementById("error-msg").textContent=e.message;
    showScreen("screen-error");
  }
}

// ── SAVES ──
async function saveAsistencia(){
  const f=[["MIEMBRO_ID","MES","FECHA","ASISTE"]];
  miembros.forEach(m=>Object.entries(m.batidas||{}).forEach(([mes,fechas])=>{
    Object.entries(fechas).forEach(([fecha,v])=>{
      if(v){
        const fd=cleanDate(fecha);
        // Only save if this date actually exists in the calendar
        if(fd && calendario[mes] && calendario[mes][fd]){
          f.push([m.id,mes,fd,"1"]);
        }
      }
    });
  }));
  await sheetWrite("Asistencia!A1",f);
}
async function savePiezas(){const f=[["MIEMBRO_ID","MES","FECHA","JABALI","CORZO"]];miembros.forEach(m=>Object.entries(m.piezas||{}).forEach(([mes,fechas])=>Object.entries(fechas).forEach(([fecha,p])=>{if((p.jabali||0)>0||(p.corzo||0)>0)f.push([m.id,mes,fecha,p.jabali||0,p.corzo||0]);})));await sheetWrite("Piezas!A1",f);}
async function saveCalendario(){const f=[["MES","FECHA"]];Object.entries(calendario).forEach(([mes,fechas])=>Object.keys(fechas).forEach(fecha=>f.push([mes,fecha])));await sheetWrite("Calendario!A1",f);}
async function saveMiembros(){await sheetWrite("Miembros!A1",[["ID","NOMBRE","TIPO","GRUPO"],...miembros.map(m=>[m.id,m.nombre,m.tipo,m.grupo||""])]);}
async function saveConfig(){await sheetWrite("Config!A1",[["CLAVE","VALOR"],["cuotaBase",cuotaBase],["cuotaFija",cuotaFija]]);}
async function saveRepartos(){await sheetWrite("Repartos!A1",[["FECHA","ESPECIE","GRUPO"],...repartos.map(r=>[r.fecha,r.especie,r.grupo])]);}
async function saveTarjetas(){const f=[["NUMERO","ASIGNADO_A"]];for(let i=1;i<=15;i++)f.push([i,tarjetas[i]||""]);await sheetWrite("Tarjetas!A1",f);}

// ── NAVIGATION ──
function showScreen(id) {
  ["screen-loading","screen-error","screen-inicio","screen-socio","screen-admin"].forEach(s=>{
    const el=document.getElementById(s);
    if(!el)return;
    if(s===id){el.style.display=(s==="screen-inicio"||s==="screen-error")?"flex":"block";}
    else el.style.display="none";
  });
}
function showSocio(){showScreen("screen-socio");socioSeleccionado=null;socioTabActual="grupos";renderSocioTab();}
function showAdmin(){showScreen("screen-admin");document.getElementById("admin-pin-view").style.display="flex";document.getElementById("admin-panel-view").style.display="none";document.getElementById("pin-input").value="";document.getElementById("pin-error").style.display="none";}
function loginAdmin(){const v=document.getElementById("pin-input").value;if(v===PIN){document.getElementById("admin-pin-view").style.display="none";document.getElementById("admin-panel-view").style.display="block";renderTab("asistencia");}else{document.getElementById("pin-error").style.display="block";document.getElementById("pin-input").value="";}}
function showTab(tab,btn){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));if(btn)btn.classList.add("active");["asistencia","piezas","grupos","calendario","miembros","tarjetas","tabla"].forEach(t=>{document.getElementById("tab-"+t).style.display=t===tab?"block":"none";});renderTab(tab);}
function renderTab(tab){if(tab==="asistencia")renderAsistencia();else if(tab==="piezas")renderPiezas();else if(tab==="grupos")renderGruposAdmin();else if(tab==="calendario")renderCalendario();else if(tab==="miembros")renderMiembros();else if(tab==="tarjetas")renderTarjetas();else if(tab==="tabla")renderTabla();}

// ── SOCIO ──
function socioTab(t){socioTabActual=t;["grupos","ranking","buscar"].forEach(x=>{const el=document.getElementById("stab-"+x);if(!el)return;if(x===t){el.style.background="#1e4d33";el.style.borderColor="#3d8a5f";el.style.color="#e8f5e2";el.style.fontWeight="600";}else{el.style.background="#0d1a10";el.style.borderColor="#1a3020";el.style.color="#4a7a5a";el.style.fontWeight="400";}});renderSocioTab();}
function renderSocioTab(){const el=document.getElementById("socio-tab-content");if(!el)return;if(socioTabActual==="grupos")renderSocioGrupos(el);else if(socioTabActual==="ranking")renderSocioRanking(el);else renderSocioBuscar(el);}

function renderSocioGrupos(el){
  const {jab,cor,jabNext,jabFalta,corNext,corFalta,totalJab,totalCor}=calcularTurno(repartos);
  let html='<div style="display:flex;gap:12px;margin-bottom:12px"><div style="flex:1;background:#0d1a10;border:1px solid #1a3020;border-radius:10px;padding:10px 14px;text-align:center"><div style="font-size:10px;color:#3a6a3a;text-transform:uppercase">Total Jabalis abatidos</div><div style="font-size:22px;font-weight:800;color:#e8a84a">'+(totalJab||0)+'</div></div><div style="flex:1;background:#0d1a10;border:1px solid #1a3020;border-radius:10px;padding:10px 14px;text-align:center"><div style="font-size:10px;color:#3a6a3a;text-transform:uppercase">Total Corzos abatidos</div><div style="font-size:22px;font-weight:800;color:#a8d8e8">'+(totalCor||0)+'</div></div></div>';

  GRUPOS.forEach((g,i)=>{html+='<tr style="background:'+(i%2===0?"#0d1a10":"#0a1208")+'"><td style="text-align:left;padding:8px 10px;font-weight:700;color:'+(g===jabNext?"#e8c27e":g===corNext?"#a8d8e8":"#c8e8c8")+'">Grupo '+g+(g===jabNext?'<span style="background:#3a2a10;color:#e8a84a;border-radius:4px;padding:1px 5px;font-size:9px;margin-left:3px">JAB</span>':"")+(g===corNext?'<span style="background:#0a1828;color:#a8d8e8;border-radius:4px;padding:1px 5px;font-size:9px;margin-left:3px">COR</span>':"")+' </td><td style="color:#e8a84a;font-weight:700;font-size:16px">'+(jab[g]||0)+'</td><td style="color:#a8d8e8;font-weight:700;font-size:16px">'+(cor[g]||0)+'</td></tr>';});
  html+='</tbody></table></div>';
  GRUPOS.forEach(g=>{const mg=miembros.filter(m=>m.grupo===g&&m.tipo!=="Z/P");html+='<div class="card" style="margin-bottom:8px"><button onclick="grupoExpandido=grupoExpandido===\''+g+'\'?null:\''+g+'\';renderSocioTab()" style="background:none;border:none;color:inherit;width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center"><div><span style="font-weight:700;color:#d4e8c2;font-size:15px">Grupo '+g+'</span><span style="color:#4a7a5a;font-size:12px;margin-left:10px">'+mg.length+' miembros</span></div><span style="color:#4caf70;font-size:18px">'+(grupoExpandido===g?"&#8722;":"&#43;")+'</span></button>'+(grupoExpandido===g?'<div style="margin-top:12px;border-top:1px solid #1a3020;padding-top:12px">'+(mg.length===0?'<div style="color:#2a4a2a;font-size:13px">Sin miembros asignados</div>':mg.map(m=>{const s=calcStats(m);return'<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #0d1a10">'+badge(m.tipo)+'<span style="flex:1;color:#c8e8c8;font-size:13px">'+m.nombre+'</span><span style="color:#e8a84a;font-size:12px">J:'+s.jab+'</span><span style="color:#a8d8e8;font-size:12px">C:'+s.cor+'</span></div>';}).join(""))+'</div>':"")+' </div>';});

}

function renderSocioRanking(el){
  const socios=miembros.filter(m=>m.tipo!=="Z/P");
  const rankJab=[...socios].map(m=>Object.assign({},m,calcStats(m))).sort((a,b)=>b.jab-a.jab).slice(0,5);

}

function actualizarTotalesFecha(){

function generarPropuesta(){
  const fecha=document.getElementById("reparto-fecha").value;
  const msg=document.getElementById("reparto-msg"), container=document.getElementById("propuesta-container");
  if(!fecha){msg.style.display="block";msg.style.color="#e87a7a";msg.textContent="Selecciona una fecha";return;}
  let totJab=0,totCor=0;
  miembros.forEach(m=>Object.values(m.piezas||{}).forEach(mesObj=>Object.entries(mesObj).forEach(([f,p])=>{if(cleanDate(f)===cleanDate(fecha)){totJab+=(p&&p.jabali)||0;totCor+=(p&&p.corzo)||0;}})));
  if(totJab===0&&totCor===0){msg.style.display="block";msg.style.color="#e87a7a";msg.textContent="No hay piezas anotadas para esta batida";return;}
  const yaJab=repartos.filter(r=>r.fecha===cleanDate(fecha)&&r.especie==="jabali").length;
  const yaCor=repartos.filter(r=>r.fecha===cleanDate(fecha)&&r.especie==="corzo").length;
  const nuevosJab=Math.max(0,totJab-yaJab), nuevosCor=Math.max(0,totCor-yaCor);
  if(nuevosJab===0&&nuevosCor===0){msg.style.display="block";msg.style.color="#4a7a9a";msg.textContent="Todas las piezas de esta batida ya están repartidas";container.style.display="none";return;}
  msg.style.display="none";
  propuestaPendiente=[];
  const repartosTemp=[...repartos];
  for(let i=0;i<nuevosJab;i++){const {jabNext}=calcularTurno(repartosTemp);propuestaPendiente.push({fecha:cleanDate(fecha),especie:"jabali",grupo:jabNext});repartosTemp.push({fecha:cleanDate(fecha),especie:"jabali",grupo:jabNext});}
  for(let i=0;i<nuevosCor;i++){const {corNext}=calcularTurno(repartosTemp);propuestaPendiente.push({fecha:cleanDate(fecha),especie:"corzo",grupo:corNext});repartosTemp.push({fecha:cleanDate(fecha),especie:"corzo",grupo:corNext});}
  renderPropuestaLista();
  container.style.display="block";
}

  const grupo=(lista,label,color)=>lista.length?'<tr><td colspan="'+(7+todasF.length)+'" style="background:#060e08;padding:4px 10px;font-size:9px;color:'+color+';letter-spacing:2px;text-transform:uppercase;font-weight:700;opacity:.7">'+label+'</td></tr>'+lista.map((m,i)=>fila(m,i)).join(""):"";
  let html='<div class="card" style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px"><label style="display:flex;flex-direction:column;gap:3px;color:#4a7a5a;font-size:12px">Cuota base perreros<input type="number" id="cuota-base-input" value="'+cuotaBase+'" class="input" style="width:110px"></label><label style="display:flex;flex-direction:column;gap:3px;color:#4a7a5a;font-size:12px">Cuota fija<input type="number" id="cuota-fija-input" value="'+cuotaFija+'" class="input" style="width:90px"></label><button class="btn" onclick="guardarCuotas()">Guardar</button><button class="btn" onclick="exportarCSV()" style="margin-left:auto;background:#1a3a4d;border-color:#2d5a6a">Exportar CSV</button></div>';
  html+='<div class="overflow-x"><table><thead><tr><th style="min-width:150px;text-align:left;border-right:1px solid #1a3020;position:sticky;left:0;background:#060e08;z-index:2" rowspan="2">NOMBRE</th><th rowspan="2">TIPO</th><th rowspan="2">GRP</th>'+mesesF.map(m=>'<th colspan="'+Object.keys(calendario[m.id]||{}).length+'" style="text-align:center;border-right:1px solid #1a3020"><div style="font-size:9px;color:#2d6a3a">'+m.eu.toUpperCase()+'</div><div style="color:#4caf70;font-size:11px">'+m.label+'</div></th>').join("")+'<th style="min-width:36px;border-left:2px solid #2d6a4f" rowspan="2">Dias</th><th style="min-width:40px" rowspan="2">%</th><th style="min-width:44px" rowspan="2">Limp.</th><th style="min-width:36px;border-left:2px solid #2d5a4f" rowspan="2">Jul.</th><th style="min-width:40px;border-left:2px solid #5a4a20;color:#e8a84a" rowspan="2">Jab.</th><th style="min-width:40px;color:#a8d8e8" rowspan="2">Cor.</th></tr><tr>'+todasF.map(({mes,fecha})=>'<th style="padding:2px;font-size:9px;color:#2d5a3a">'+fecha.slice(5).replace("-","/")+'</th>').join("")+'</tr></thead><tbody>'+grupo(socios,"Socios","#7ee8a2")+grupo(invit,"Invitados","#7eb8e8")+grupo(menores,"Menores","#e8c27e")+'<tr style="background:#060e08;border-top:2px solid #2d6a4f"><td colspan="3" style="padding:7px 10px;color:#4caf70;font-weight:700;font-size:12px;position:sticky;left:0;background:#060e08;border-right:1px solid #1a3020">DENETARA / TOTAL</td>'+todasF.map(({mes,fecha})=>{const cnt=miembros.filter(m=>m.tipo!=="Z/P"&&!!((m.batidas&&m.batidas[mes.id])||{})[fecha]).length;return'<td style="color:'+(cnt>0?"#4caf70":"#1a3020")+';font-weight:700;font-size:12px">'+(cnt||"")+'</td>';}).join("")+'<td style="color:#4caf70;font-weight:800;font-size:14px;border-left:2px solid #2d6a4f">'+miembros.filter(m=>m.tipo!=="Z/P").reduce((s,m)=>s+calcStats(m).dias,0)+'</td><td colspan="3"></td><td style="color:#e8c27e;font-weight:800;border-left:2px solid #3a2a10">'+(totJ||"")+'</td><td style="color:#a8d8e8;font-weight:800">'+(totC||"")+'</td></tr></tbody></table></div>';
  if(perros.length){html+='<div style="font-size:11px;color:#4a7a5a;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px">Zakurzale / Perreros</div><div class="overflow-x"><table><thead><tr>'+["Nombre","Batidas","%","Cuota prop.","Cuota fija","TOTAL"].map((h,i)=>'<th style="text-align:'+(i===0?"left":"center")+';color:'+(i===5?"#4caf70":"#3a6a3a")+'">'+h+'</th>').join("")+'</tr></thead><tbody>'+perros.map((m,i)=>{const s=calcStats(m),prop=(s.pct/100)*cuotaBase;return'<tr style="background:'+(i%2===0?"#0d1a10":"#0a1208")+'"><td style="padding:9px 12px;color:#c8e8c8;text-align:left">'+m.nombre+'</td><td style="color:#7ee8a2;font-weight:700">'+s.dias+'</td><td style="color:#4a8a5a">'+s.pct.toFixed(2)+'%</td><td style="color:#c8e8c8">'+prop.toFixed(2)+'</td><td style="color:#c8e8c8">'+cuotaFija.toFixed(2)+'</td><td style="color:#4caf70;font-weight:700;font-size:14px">'+(prop+cuotaFija).toFixed(2)+'</td></tr>';}).join("")+'</tbody></table></div>';}
  html+='<div class="grid-stats">'+[["Total batidas",total,"#4caf70"],["Media caz./dia",total>0?(miembros.filter(m=>m.tipo!=="Z/P").reduce((s,m)=>s+calcStats(m).dias,0)/total).toFixed(1):"--","#4caf70"],["Socios activos",miembros.filter(m=>m.tipo==="SOCIO"&&calcStats(m).dias>0).length+"/"+miembros.filter(m=>m.tipo==="SOCIO").length,"#4caf70"],["Total Jabalis",totJ,"#e8a84a"],["Total Corzos",totC,"#a8d8e8"]].map(x=>'<div class="stat-card"><div style="font-size:10px;color:#2a4a2a;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">'+x[0]+'</div><div style="font-size:26px;font-weight:800;color:'+x[2]+'">'+x[1]+'</div></div>').join("")+'</div>';
  document.getElementById("tab-tabla").innerHTML=html;
}
function guardarCuotas(){cuotaBase=+document.getElementById("cuota-base-input").value||750;cuotaFija=+document.getElementById("cuota-fija-input").value||75;withSave(()=>saveConfig());}
function exportarCSV(){const todasF=MESES.flatMap(m=>Object.keys(calendario[m.id]||{}).sort().map(f=>({mes:m,fecha:cleanDate(f)})));const hdr=["Nombre","Tipo","Grupo",...todasF.map(b=>b.fecha),"Dias","%","Limpieza","Julio","Jabali","Corzo"].join(";");const rows=miembros.filter(m=>m.tipo!=="Z/P").map(m=>{const s=calcStats(m);return[m.nombre,m.tipo,m.grupo||"",...todasF.map(b=>((m.batidas&&m.batidas[b.mes.id])||{})[b.fecha]?"1":""),s.dias,s.pct.toFixed(2),s.limp.toFixed(2),s.jul,s.jab,s.cor].join(";");});const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+[hdr,...rows].join("\n")],{type:"text/csv;charset=utf-8"}));a.download="fielato_2026-2027.csv";a.click();}

// ── START ──
init();
</script>
